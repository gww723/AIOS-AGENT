services:
  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    container_name: aiops-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aiops
      MYSQL_USER: aiops
      MYSQL_PASSWORD: aiops
    ports: ["3306:3306"]
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/aiops12345
    ports: ["7474:7474","7687:7687"]
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  loki:
    image: grafana/loki:3.7.0
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["3100:3100"]
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml:ro
  simulator:
    build: .
    command: npm run simulator
    ports:
      - "9101-9111:9101-9111"
      - "9200:9200"
  app:
    build: .
    command: npm run start
    env_file: .env.docker
    depends_on: [kafka,mysql,neo4j,prometheus,loki,simulator]
    ports: ["9300:9300"]
  collector:
    build: .
    command: npm run collector
    env_file: .env.docker
    depends_on: [kafka,prometheus,simulator]
